<script>
(function(){
  'use strict';
  // One question per clip. The transcript stays out of the visible exam interface.
  const QUESTIONS = [
    {id:'L01',type:'listening',accent:'en-GB',use:'prediction-evidence',audio:"I can see dark clouds over the soccer field, and the wind is getting stronger. We should go inside. It is going to rain in a few minutes.",ask:'Why does the speaker predict rain?',options:['Because of what the speaker can see now.','Because the speaker made a plan yesterday.','Because the speaker is making a promise.','Because a friend asked for a favor.'],correct:0},
    {id:'L02',type:'listening',accent:'en-US',use:'plan',audio:"My cousins and I bought our tickets last Monday. We are going to take the bus to Popayán on Saturday morning. We have already planned the whole day.",ask:'What does the trip show?',options:['A sudden decision made while speaking.','A plan made before this conversation.','A request for help with tickets.','A prediction with no evidence.'],correct:1},
    {id:'L03',type:'listening',accent:'en-AU',use:'decision-now',audio:"Oh, the classroom lights are off. We cannot see the board. Wait a second, I will turn them on. That should help everyone see the lesson.",ask:'When does the speaker decide to turn on the lights?',options:['Last weekend.','After the lesson.','At that moment.','Before coming to class.'],correct:2},
    {id:'L04',type:'listening',accent:'en-US',use:'promise',audio:"I know I was late last time, but tomorrow will be different. I will be at the school gate at seven. You can count on me.",ask:'What is the speaker mainly doing?',options:['Asking for directions.','Making a promise to arrive on time.','Predicting the weather.','Refusing to go to school.'],correct:1},
    {id:'L05',type:'listening',accent:'en-GB',use:'request',audio:"Hi, Mia. I missed yesterday's class, and I do not understand the homework. Will you send me a photo of your notes when you have time?",ask:'What does the speaker want Mia to do?',options:['Make a prediction about tomorrow.','Decide what subject to study.','Send a photo of her class notes.','Promise not to come to class.'],correct:2},
    {id:'L06',type:'listening',accent:'en-US',use:'prediction-opinion',audio:"I believe people will use more electric buses in ten years. I do not have any special information. It is just my opinion about the future.",ask:'What is the prediction based on?',options:['A ticket the speaker bought.','Something happening in front of the speaker.','An earlier travel plan.','The speaker’s personal belief.'],correct:3},
    {id:'L07',type:'listening',accent:'en-AU',use:'refusal',audio:"My little brother is at the table with us, but he will not eat his vegetables. Mom asked three times, and he keeps saying no.",ask:'What does “will not” express here?',options:['A promise about tomorrow.','A refusal to do something.','A prediction about food prices.','A future travel plan.'],correct:1},
    {id:'L08',type:'listening',accent:'en-GB',use:'offer',audio:"Those boxes are too heavy for you to carry alone. I will take the two on the top, and you can carry the small one.",ask:'Why does the speaker say “I will take the two on the top”?',options:['To offer help.','To make a negative prediction.','To ask someone to buy boxes.','To describe an old plan.'],correct:0},
    {id:'L09',type:'listening',accent:'en-US',use:'negative-prediction',audio:"I do not think paper books will disappear. Many people still enjoy reading them, and I believe libraries will stay important for a long time.",ask:'What does the speaker believe?',options:['Someone refuses to read a book.','All libraries are going to close now.','Paper books will continue to exist.','The speaker has decided to buy a book.'],correct:2},
    {id:'L10',type:'listening',accent:'en-AU',use:'prediction-evidence',audio:"Look at Julia's bicycle! The front tire is completely flat, and her class starts in five minutes. She is going to be late if she walks.",ask:'Which detail supports the speaker’s prediction?',options:['Julia likes her bicycle.','Julia has a flat tire and very little time.','Julia promised to walk.','Julia is planning a holiday.'],correct:1},
    {id:'L11',type:'listening',accent:'en-GB',use:'plan',audio:"We decided last night that we are going to make breakfast for my grandmother on Sunday. I have written a shopping list, so everything is ready.",ask:'Why is “going to” appropriate in this situation?',options:['The idea began while the speaker was talking.','The speaker refuses to make breakfast.','The family asks for a favor.','The family had already made the plan.'],correct:3},
    {id:'L12',type:'listening',accent:'en-US',use:'decision-now',audio:"Your phone is ringing, and you are busy cooking. Do not worry, I will answer it. You can keep working on dinner.",ask:'What happens in this conversation?',options:['The speaker makes an immediate decision to help.','The speaker describes a trip arranged earlier.','The speaker refuses to answer the phone.','The speaker predicts a phone will break.'],correct:0},
    {id:'L13',type:'listening',accent:'en-AU',use:'negative-promise',audio:"You told me something personal, and I respect that. I will not tell anyone. I promise you can trust me.",ask:'What is the purpose of “I will not tell anyone”?',options:['A prediction about other people.','An explanation of a past mistake.','A promise to keep a secret.','A request to share the secret.'],correct:2},
    {id:'L14',type:'listening',accent:'en-GB',use:'refusal',audio:"We have asked Kevin to turn down the music, but he will not listen. He says he likes it loud and refuses to change it.",ask:'What does “he will not listen” mean here?',options:['Kevin plans to buy speakers.','Kevin refuses to listen to the request.','Kevin thinks the music will stop later.','Kevin makes a promise to be quiet.'],correct:1},
    {id:'L15',type:'listening',accent:'en-US',use:'request',audio:"I have a dentist appointment early tomorrow. Will you remind me to take my documents before I leave home? I always forget them.",ask:'What is the speaker doing?',options:['Making a prediction with present evidence.','Refusing to take documents.','Offering to help someone else.','Asking someone for a reminder.'],correct:3},

    {id:'U01',type:'usage',use:'prediction-opinion',scene:'During a class discussion, Sara says: “I think our city will have more green spaces in the future.” She has no specific information or news about this.',ask:'What explains Sara’s use of “will”?',options:['She is describing a plan already arranged.','She is giving a personal prediction.','She is asking for permission.','She is refusing to visit a park.'],correct:1},
    {id:'U02',type:'usage',use:'prediction-evidence',scene:'A family is at the beach. The sky turns very dark, the wind becomes strong, and people begin to close their umbrellas.',ask:'Which statement best explains the situation?',options:['“It is going to rain” refers to visible evidence.','“I will help” is a prediction about the weather.','“Will you go?” expresses a promise.','“We will not swim” necessarily expresses refusal.'],correct:0},
    {id:'U03',type:'usage',use:'plan',scene:'On Thursday, Andrés reserved a table for Saturday night. Today he tells his friends: “We are going to have dinner at eight.”',ask:'Why does Andrés choose “going to”?',options:['He decided to eat at that exact moment.','He is making an offer to the waiter.','The dinner was planned before he spoke.','He is predicting rain from dark clouds.'],correct:2},
    {id:'U04',type:'usage',use:'decision-now',scene:'Paula enters the classroom and sees that the windows are open. Papers are flying across the room. She says, “I’ll close the windows.”',ask:'Which detail explains Paula’s use of “will”?',options:['She booked a visit last week.','She suddenly decides to act after seeing the problem.','She is refusing to help her classmates.','She is predicting what schools will look like.'],correct:1},
    {id:'U05',type:'usage',use:'offer',scene:'David notices that his friend is carrying a heavy backpack and two large bags. He says, “I’ll carry one of those bags for you.”',ask:'What is David’s communicative intention?',options:['He is volunteering to help his friend.','He is asking his friend for a bag.','He is describing a fixed plan for next year.','He is refusing to carry anything.'],correct:0},
    {id:'U06',type:'usage',use:'promise',scene:'Valentina forgot to return a library book. Her friend is worried about the fine. Valentina says, “I’ll return it first thing tomorrow. I promise.”',ask:'Which interpretation fits best?',options:['She predicts the library will close.','She asks someone else to return the book.','She refuses to go to the library.','She makes a commitment about her action.'],correct:3},
    {id:'U07',type:'usage',use:'request',scene:'The class is planning a small event. Juan has the list of participants. Lina asks, “Will you send me the list this afternoon?”',ask:'What does Lina want to do?',options:['Predict the number of students.','Ask Juan to send the list.','Promise to organize the event.','Explain a plan she made yesterday.'],correct:1},
    {id:'U08',type:'usage',use:'refusal',scene:'During dinner, Diego asks his little sister to put her tablet away. She answers “No!” several times and keeps using it. Diego says, “She won’t put it away.”',ask:'What does “won’t” mean in this context?',options:['She made a plan for tomorrow.','She will probably buy another tablet.','She refuses to put the tablet away.','She promises to put it away later.'],correct:2},
    {id:'U09',type:'usage',use:'negative-prediction',scene:'A student says, “In my opinion, people won’t stop listening to music on their phones in the next twenty years.”',ask:'How should we understand “won’t” here?',options:['The student predicts that something will not happen.','People are refusing to turn off music right now.','The student is asking a friend for help.','People arranged a music event last night.'],correct:0},
    {id:'U10',type:'usage',use:'prediction-contrast',scene:'Two students talk about the same football match. Nico says, “I think our team will win.” Eva says, “Look, it’s four to zero. Our team is going to win!”',ask:'What makes their predictions different?',options:['Nico is making a request; Eva is making an offer.','Nico has an earlier plan; Eva makes a promise.','Both students are refusing to watch the game.','Nico gives an opinion; Eva uses evidence from the score.'],correct:3},
    {id:'U11',type:'usage',use:'decision-contrast',scene:'Last night, Luisa decided to study on Saturday. Today she says, “I’m going to study on Saturday.” A minute later, her friend drops some papers and Luisa says, “I’ll pick them up.”',ask:'Which comparison is correct?',options:['Both statements describe promises.','The first expresses an earlier plan; the second, a decision now.','The first expresses refusal; the second, a prediction.','Both statements are based on visible evidence of rain.'],correct:1},
    {id:'U12',type:'usage',use:'prediction-evidence',scene:'Marcos sees smoke coming from a toaster. The bread is already black. He says, “The toast is going to burn.”',ask:'What is the strongest clue for this prediction?',options:['Marcos has a plan for tomorrow.','Marcos wants someone to make breakfast.','He can see smoke and black bread right now.','Marcos believes all toasters will change in the future.'],correct:2},
    {id:'U13',type:'usage',use:'wont-contrast',scene:'A: “I don’t think cars will disappear in the next five years.” B: “My brother won’t lend me his car. He keeps saying no.”',ask:'What does “won’t” mean in A and B?',options:['A: negative prediction; B: refusal.','A: refusal; B: negative prediction.','A: promise; B: request.','A: prior plan; B: spontaneous decision.'],correct:0},
    {id:'U14',type:'usage',use:'promise',scene:'Camilo is preparing a group presentation. The team is concerned because last time he forgot his part. He looks at them and says, “I won’t forget the slides this time. You have my word.”',ask:'Which use of “won’t” fits best?',options:['A refusal to present.','A negative prediction about technology.','A request for the slides.','A promise not to forget something.'],correct:3},
    {id:'U15',type:'usage',use:'request',scene:'Mariana needs to find a classroom in a large building. She wants a classmate to accompany her. She must ask for help politely.',ask:'Which message best matches Mariana’s intention?',options:['“I think the building will be bigger.”','“Will you come with me to find the classroom?”','“I am going to walk to class; I decided yesterday.”','“I won’t enter the room; I refuse.”'],correct:1}
  ];

  const KEY='cesmag_english_ii_future_saber_pro_30q_v1';
  const CODE='2027';
  const LETTERS=['A','B','C','D'];
  const app=document.getElementById('app');
  let state=null;
  let temporaryChoice=null;
  let speechToken=0;
  let utterance=null;
  let lastAudioStarted=0;
  let testHeard=false;
  let blurHandle=null;
  let splitHandle=null;
  let examWasFullscreen=false;
  let guardIsActive=false;
  let channel=null;
  let translationObserver=null;
  const instanceId=String(Date.now())+'_'+Math.random().toString(36).slice(2);
  const questionById=Object.fromEntries(QUESTIONS.map(q=>[q.id,q]));

  function safeText(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function shuffle(array){const x=[...array];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}
  function save(){if(state){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){setMessage('No se pudo guardar el intento en el dispositivo.');}}}
  function storageAvailable(){try{const k=KEY+'_test';localStorage.setItem(k,'ok');const valid=localStorage.getItem(k)==='ok';localStorage.removeItem(k);return valid;}catch(e){return false;}}
  function retrieve(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.v===1&&Array.isArray(x.order)&&x.order.length===30&&typeof x.name==='string')return x;}catch(e){}return null;}
  function setMessage(s){const n=document.querySelector('[data-feedback]');if(n)n.textContent=s;}
  function currentQuestion(){return state&&state.index<state.order.length?questionById[state.order[state.index]]:null;}
  function durationSeconds(){return state?Math.max(0,Math.floor((Date.now()-state.startedAt)/1000)):0;}
  function stopSpeech(){speechToken++;try{if('speechSynthesis'in window)window.speechSynthesis.cancel();}catch(e){}utterance=null;}
  function availableVoices(){try{return window.speechSynthesis.getVoices().filter(v=>/^en([_-]|$)/i.test(v.lang));}catch(e){return [];}}
  function voiceRank(v,accent){const n=(v.name+' '+v.lang).toLowerCase();let score=0;if(v.lang.toLowerCase().replace('_','-')===accent.toLowerCase())score+=75;else if(v.lang.toLowerCase().startsWith(accent.slice(0,2).toLowerCase()))score+=20;if(/natural|neural|premium|enhanced|siri|google|microsoft|samantha|daniel|karen|moira|ava|serena|oliver|jenny|aria|ryan/i.test(n))score+=55;if(/compact|espeak|basic|robot/i.test(n))score-=35;if(/united kingdom|british/i.test(n)&&accent==='en-GB')score+=17;if(/austral/i.test(n)&&accent==='en-AU')score+=17;return score;}
  function bestVoice(accent){const v=availableVoices();if(!v.length)return null;return [...v].sort((a,b)=>voiceRank(b,accent)-voiceRank(a,accent))[0];}
  function playSpeech(textValue,accent,isTest){
    if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){setMessage('Este navegador no tiene síntesis de voz. Prueba con Safari o Chrome actualizado.');return;}
    if(isTest)testHeard=false;
    stopSpeech();
    const id=speechToken;
    const u=new SpeechSynthesisUtterance(textValue);
    u.lang=accent||'en-US';u.rate=state?state.rate:0.90;u.pitch=1;u.volume=1;
    const voice=bestVoice(u.lang);if(voice)u.voice=voice;
    utterance=u;
    let didStart=false;
    u.onstart=()=>{if(id!==speechToken)return;didStart=true;lastAudioStarted=Date.now();if(isTest){testHeard=true;setMessage('Reproduciendo la prueba. Confirma que escuchas el inglés con claridad.');}else{setAudioStatus('Reproduciendo… Escucha el contexto con atención.');}}
    u.onend=()=>{if(id!==speechToken)return;utterance=null;if(isTest)setMessage('Prueba terminada. Si escuchaste con claridad, marca la casilla.');else setAudioStatus('Audio terminado. Puedes escucharlo nuevamente.');};
    u.onerror=(ev)=>{if(id!==speechToken)return;utterance=null;const cancelled=['canceled','interrupted'].includes(ev.error);if(!cancelled){if(isTest){testHeard=false;setMessage('No se pudo reproducir. Revisa el volumen y prueba otro navegador o dispositivo.');}else setAudioStatus('Error de voz. Toca «Escuchar otra vez».');}};
    try{window.speechSynthesis.speak(u);}catch(e){setMessage('No se pudo iniciar el audio en este dispositivo.');return;}
    setTimeout(()=>{if(id===speechToken&&!didStart){if(isTest)setMessage('Si no se oye la prueba, revisa volumen, modo silencio y voces del navegador.');else setAudioStatus('Si no suena, toca «Escuchar otra vez» y revisa el volumen.');}},2800);
  }
  function setAudioStatus(s){const el=document.getElementById('audio-status');if(el)el.textContent=s;}

  function startPage(){
    stopSpeech();guardIsActive=false;
    app.innerHTML=`<section class="cover"><div class="brand">CESMAG · ENGLISH II · A2</div><h1 class="big">FUTURE<br>IN CONTEXT<span style="color:#c0f0dc">.</span></h1><p class="sub">Will, won’t & going to. Understand the reason behind each choice.</p><div class="pillrow"><span class="pill">SABER PRO · INSPIRED</span><span class="pill">MOBILE FIRST</span></div><div class="orb" aria-hidden="true"></div></section><section class="screen"><div class="introcard"><div class="eyebrow">Evaluación individual</div><h2 class="heading">Listen. Think. Choose.</h2><p class="desc">30 situaciones reales en inglés para identificar <b>usos y significados</b>. Una sola respuesta por pregunta.</p><div class="metricrow"><div class="metric"><b>15</b><span>LISTENING</span></div><div class="metric"><b>15</b><span>USOS</span></div><div class="metric"><b>5.0</b><span>NOTA MÁXIMA</span></div></div><label class="fieldlabel" for="student">Nombre completo del estudiante</label><input id="student" class="namefield" type="text" autocomplete="name" autocapitalize="words" maxlength="90" placeholder="Escribe nombres y apellidos" spellcheck="false"><p class="smallheading">Antes de empezar: prueba de audio</p><div class="voicebox"><p>Los listening usan las voces inglesas de tu dispositivo. Escucha el ejemplo y comprueba su calidad.</p><div class="voiceactions"><button class="chipbutton" id="test-audio" type="button">▶ Probar audio en inglés</button><button class="chipbutton" id="stop-test" type="button">■ Detener</button></div><div class="error" data-feedback role="status"></div></div><label class="speakercheck"><input id="heard-audio" type="checkbox"><span>Confirmo que escuché la prueba y tengo el volumen adecuado.</span></label><div class="notice"><b>Reglas de protección:</b> un solo intento; no cambiar de pestaña o aplicación, dividir pantalla, actualizar, copiar, pegar ni abrir otras ventanas. Si se detecta una interrupción, la pregunta activa se marca incorrecta y la evaluación se bloquea hasta que el docente la habilite.</div><button id="begin" class="primary" type="button">Comenzar evaluación →</button><p class="error" id="start-error" role="alert"></p></div><p class="footertext">Nivel II · 30 preguntas · Preguntas y audios en inglés</p></section>`;
    document.getElementById('test-audio').addEventListener('click',()=>playSpeech('Hello! This is your English listening test. You can play every audio more than once. Good luck!', 'en-US',true));
    document.getElementById('stop-test').addEventListener('click',()=>{stopSpeech();setMessage('Audio detenido.');});
    document.getElementById('begin').addEventListener('click',begin);
  }
  function begin(){
    const name=document.getElementById('student').value.replace(/\s+/g,' ').trim();
    const error=document.getElementById('start-error');
    if(name.length<6||name.split(' ').length<2){error.textContent='Escribe nombres y apellidos completos antes de iniciar.';return;}
    if(!document.getElementById('heard-audio').checked||!testHeard){error.textContent='Primero reproduce el audio de prueba, escucha la voz y confirma que se oye correctamente.';return;}
    if(!('speechSynthesis'in window)){error.textContent='Este navegador no admite la reproducción de los listening.';return;}
    if(!storageAvailable()){error.textContent='Activa el almacenamiento del navegador y sal del modo privado antes de iniciar: el intento debe poder guardarse.';return;}
    if(retrieve()){state=retrieve();render();return;}
    stopSpeech();
    const listeningOrder=shuffle(QUESTIONS.filter(x=>x.type==='listening').map(x=>x.id));
    const useOrder=shuffle(QUESTIONS.filter(x=>x.type==='usage').map(x=>x.id));
    const optionOrder=Object.fromEntries(QUESTIONS.map(q=>[q.id,shuffle([0,1,2,3])]));
    state={v:1,name,startedAt:Date.now(),order:[...listeningOrder,...useOrder],optionOrder,index:0,answers:{},violations:[],locked:null,done:false,rate:.9,baseline:{width:innerWidth,height:innerHeight},fullscreenEngaged:false};
    save();render();
    try{if(document.documentElement.requestFullscreen){const p=document.documentElement.requestFullscreen({navigationUI:'hide'});if(p&&p.then)p.then(()=>{if(state&&!state.done){state.fullscreenEngaged=true;examWasFullscreen=true;save();}}).catch(()=>{});}}catch(e){}
  }

  function header(){
    const n=Math.min(state.index+1,30),percent=(state.index/30)*100;
    return `<div class="topbar"><div class="toprow"><div><div class="topbrand">CESMAG · ENGLISH II</div><div class="studentline" title="${safeText(state.name)}">${safeText(state.name)}</div></div><div class="statuspill">● EN CURSO</div></div><div class="progressmeta"><span><strong>${n} / 30</strong> preguntas</span><span>${state.index<15?'LISTENING':'USOS EN CONTEXTO'}</span></div><div class="progress" aria-label="Progreso"><span style="width:${percent}%"></span></div></div>`;
  }
  function render(){
    if(translationObserver){translationObserver.disconnect();translationObserver=null;}
    if(!state){startPage();return;}
    if(state.done){stopSpeech();guardIsActive=false;renderFinish();return;}
    if(state.locked){stopSpeech();guardIsActive=false;renderLocked();return;}
    if(state.index>=30){finish();return;}
    guardIsActive=true;temporaryChoice=null;
    const q=currentQuestion();
    const isAudio=q.type==='listening';
    const countInSection=state.index%15+1;
    const audio=isAudio?`<div class="listenunit"><div class="audioart"><div class="sounddisc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg></div><div><b>Audio ${countInSection} de 15</b><span>Escucha la situación. Puedes repetirla.</span></div></div><div class="listencontrols"><button type="button" id="play-audio" class="play">▶ Escuchar audio</button><button type="button" id="stop-audio" class="stop" aria-label="Detener audio">■</button></div><div id="audio-status" class="audiosub" role="status">Toca reproducir para comenzar.</div><div class="rates"><span>VELOCIDAD</span><button type="button" class="ratebtn ${state.rate===.8?'on':''}" data-rate="0.8">0.8×</button><button type="button" class="ratebtn ${state.rate===.9?'on':''}" data-rate="0.9">0.9×</button><button type="button" class="ratebtn ${state.rate===1?'on':''}" data-rate="1">1.0×</button></div></div>`:'';
    const context=isAudio?'':`<div class="scenebox" lang="en" translate="no">${safeText(q.scene)}</div>`;
    const opts=state.optionOrder[q.id].map((original,i)=>`<button type="button" class="option" data-answer="${original}" aria-pressed="false"><span class="letter">${LETTERS[i]}</span><span>${safeText(q.options[original])}</span></button>`).join('');
    app.innerHTML=header()+`<section class="exam"><div class="sectionhead"><div class="sectiontag">${isAudio?'01 · Listening comprehension':'02 · Understanding future uses'}</div><div class="qnumber">PREGUNTA ${state.index+1}</div></div><article class="panel"><div class="eyebrow">${isAudio?'LISTEN AND INTERPRET':'READ AND INTERPRET'}</div>${audio}${context}<h2 class="qtitle" lang="en" translate="no">${safeText(q.ask)}</h2><div class="choices" lang="en" translate="no" role="group" aria-label="Opciones de respuesta">${opts}</div><div class="answerfooter"><button type="button" id="submit-answer" class="primary dark" disabled>Confirmar y continuar →</button></div></article><div class="tip">Lee las cuatro opciones. Solo puedes confirmar una vez.</div></section>`;
    app.querySelectorAll('[data-answer]').forEach(btn=>btn.addEventListener('click',()=>{
      temporaryChoice=Number(btn.dataset.answer);
      app.querySelectorAll('[data-answer]').forEach(b=>{const sel=b===btn;b.classList.toggle('selected',sel);b.setAttribute('aria-pressed',String(sel));});
      document.getElementById('submit-answer').disabled=false;
    }));
    document.getElementById('submit-answer').addEventListener('click',submitAnswer);
    if(isAudio){
      document.getElementById('play-audio').addEventListener('click',()=>playSpeech(q.audio,q.accent,false));
      document.getElementById('stop-audio').addEventListener('click',()=>{stopSpeech();setAudioStatus('Audio detenido. Puedes reproducirlo de nuevo.');});
      app.querySelectorAll('[data-rate]').forEach(b=>b.addEventListener('click',()=>{state.rate=Number(b.dataset.rate);save();stopSpeech();app.querySelectorAll('[data-rate]').forEach(x=>x.classList.toggle('on',x===b));setAudioStatus('Velocidad ajustada. Toca reproducir de nuevo.');}));
    }
    // Observe protected question text. A translation extension which rewrites the
    // visible stem/options is treated as an integrity interruption.
    translationObserver=new MutationObserver(()=>{if(guardIsActive)lockFor('modificación o traducción del contenido de la pregunta');});
    app.querySelectorAll('.qtitle,.choices,.scenebox').forEach(n=>translationObserver.observe(n,{subtree:true,childList:true,characterData:true}));
  }
  function submitAnswer(){
    if(!state||state.done||state.locked||temporaryChoice===null)return;
    const q=currentQuestion();if(!q)return;
    state.answers[q.id]={selected:temporaryChoice,correct:temporaryChoice===q.correct,violation:false,time:Date.now()};
    state.index++;save();stopSpeech();render();window.scrollTo(0,0);
  }
  function lockFor(reason){
    if(!state||state.done||state.locked||!guardIsActive)return;
    guardIsActive=false;stopSpeech();if(translationObserver){translationObserver.disconnect();translationObserver=null;}
    const q=currentQuestion();
    if(q){state.answers[q.id]={selected:null,correct:false,violation:true,time:Date.now()};state.index++;}
    state.locked={reason,time:Date.now()};state.violations.push({question:q?q.id:null,reason,time:Date.now()});save();renderLocked();
  }
  function renderLocked(){
    stopSpeech();guardIsActive=false;
    app.innerHTML=header()+`<section class="exam"><article class="panel"><div class="eyebrow">Protocolo de integridad</div><h2 class="heading">Evaluación interrumpida</h2><p class="desc">El examen conserva el progreso anterior. La pregunta que estaba activa ya fue registrada como incorrecta.</p><p class="desc">Incidencias registradas: <b>${state.violations.length}</b>.</p></article></section><div class="lockcover" role="dialog" aria-modal="true" aria-labelledby="lock-title"><div class="lockcard"><div class="lockicon">🔒</div><div class="eyebrow">Acceso restringido</div><h2 id="lock-title">Examen bloqueado</h2><p>Se detectó: <b>${safeText(state.locked.reason)}</b>.</p><div class="dangerline">La pregunta activa se calificó incorrecta.</div><p>Solicita al docente el código de desbloqueo. El intento continuará donde corresponde y no podrá reiniciarse.</p><label class="fieldlabel" for="unlock" style="text-align:left">Código del docente</label><input id="unlock" class="namefield" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="••••"><div class="error" data-feedback role="alert"></div><button type="button" id="unlock-button" class="primary">Desbloquear y continuar →</button></div></div>`;
    const field=document.getElementById('unlock');
    const unlock=()=>{if(field.value!==CODE){setMessage('Código incorrecto. Solicita la clave al docente.');field.value='';return;}state.locked=null;save();if(state.index>=30)finish();else{render();window.scrollTo(0,0);}};
    document.getElementById('unlock-button').addEventListener('click',unlock);
    field.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();unlock();}});
  }
  function finish(){
    if(!state||state.done)return;
    stopSpeech();guardIsActive=false;
    state.done=true;state.finishedAt=Date.now();state.locked=null;save();
    renderFinish();
  }
  function scoreData(){
    const correct=state.order.reduce((n,id)=>n+(state.answers[id]?.correct?1:0),0);
    const l=state.order.slice(0,15).reduce((n,id)=>n+(state.answers[id]?.correct?1:0),0);
    const u=correct-l;
    return {correct,l,u,wrong:30-correct,grade:(correct*5/30).toFixed(1)};
  }
  function report(){
    const s=scoreData();const start=new Date(state.startedAt).toLocaleString('es-CO');const end=new Date(state.finishedAt||Date.now()).toLocaleString('es-CO');
    const rows=state.order.map((id,i)=>{const q=questionById[id],a=state.answers[id];return `${String(i+1).padStart(2,'0')}. ${q.type==='listening'?'LISTENING':'USOS'} · ${id} · ${a?.violation?'INCORRECTA POR BLOQUEO':a?.correct?'CORRECTA':'INCORRECTA'} · elección: ${a?.selected===null||a?.selected===undefined?'sin respuesta':LETTERS[state.optionOrder[id].indexOf(a.selected)]}`;});
    return [`CESMAG - ENGLISH II A2 | FUTURE IN CONTEXT`,'Evaluación de usos: will / won’t / going to','',`Estudiante: ${state.name}`,`Inicio: ${start}`,`Finalización: ${end}`,`Nota: ${s.grade} / 5.0`,`Aciertos: ${s.correct} / 30`,`Listening: ${s.l} / 15`,`Usos en contexto: ${s.u} / 15`,`Bloqueos registrados: ${state.violations.length}`,'',...rows,'',...state.violations.map((v,i)=>`Incidencia ${i+1}: pregunta ${v.question||'final'}, ${v.reason}, ${new Date(v.time).toLocaleString('es-CO')}`)].join('\n');
  }
  function renderFinish(){
    const s=scoreData();
    app.innerHTML=`<section class="finishcover"><small>CESMAG · ENGLISH II · A2</small><h1>Evaluación finalizada</h1><p style="font-size:13px;color:#eeeaff">${safeText(state.name)}</p><div class="scorebubble"><strong>${s.grade}</strong><span>NOTA SOBRE 5.0</span></div><p style="font-size:13px;color:#dcd5ff">${s.correct} respuestas correctas de 30</p></section><section class="finishbody"><div class="eyebrow">Resumen por sección</div><div class="resultrow"><span>🎧 Listening</span><b>${s.l} / 15</b></div><div class="resultrow"><span>📚 Usos en contexto</span><b>${s.u} / 15</b></div><div class="resultrow"><span>🔒 Incidencias de seguridad</span><b>${state.violations.length}</b></div><div class="resultnote">La evaluación ha terminado y el intento permanece registrado en este navegador. Guarda o comparte el reporte con tu docente. No se muestra la clave de respuestas.</div><div class="actionrow"><button type="button" id="download-report">↓ Descargar reporte</button><button type="button" id="share-report">↗ Compartir resultado</button></div><p class="footertext">Resultado individual · ${new Date(state.finishedAt||Date.now()).toLocaleString('es-CO')}</p></section>`;
    document.getElementById('download-report').addEventListener('click',()=>{
      const blob=new Blob(['\ufeff'+report()],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Resultado_English_II_'+state.name.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]+/g,'_').slice(0,35)+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);
    });
    document.getElementById('share-report').addEventListener('click',async()=>{
      const t=report();if(navigator.share){try{await navigator.share({title:'Resultado English II · '+state.name,text:t});return;}catch(e){if(e.name==='AbortError')return;}}
      if(navigator.clipboard&&navigator.clipboard.writeText){try{await navigator.clipboard.writeText(t);alert('Resultado copiado. Envíalo a tu docente.');return;}catch(e){}}
      alert('Utiliza «Descargar reporte» para conservar tu resultado.');
    });
  }

  // Defensive browser-side exam controls. No browser can observe every OS overlay,
  // external device or translation extension, so these are best-effort checks.
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')lockFor('cambio de pestaña, aplicación o pantalla oculta');});
  window.addEventListener('blur',()=>{if(!guardIsActive)return;clearTimeout(blurHandle);blurHandle=setTimeout(()=>{if(!document.hasFocus())lockFor('la ventana de evaluación perdió el foco');},350);});
  window.addEventListener('focus',()=>clearTimeout(blurHandle));
  window.addEventListener('pagehide',()=>lockFor('salida, cierre o actualización de la página'));
  window.addEventListener('beforeunload',()=>lockFor('salida o actualización de la página'));
  window.addEventListener('freeze',()=>lockFor('evaluación enviada a segundo plano'));
  document.addEventListener('fullscreenchange',()=>{if(!state||state.done||state.locked)return;if(document.fullscreenElement){examWasFullscreen=true;state.fullscreenEngaged=true;save();}else if(examWasFullscreen)lockFor('salida del modo pantalla completa');});
  function checkSplit(){if(!guardIsActive||!state?.baseline||state.done||state.locked)return;const b=state.baseline;const width=window.visualViewport?.width||innerWidth;const height=window.visualViewport?.height||innerHeight;if(width<b.width*.76||height<b.height*.62)lockFor('posible pantalla dividida o ventana superpuesta');}
  window.addEventListener('resize',()=>{if(!guardIsActive)return;clearTimeout(splitHandle);splitHandle=setTimeout(checkSplit,850);});
  if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{if(!guardIsActive)return;clearTimeout(splitHandle);splitHandle=setTimeout(checkSplit,850);});
  window.addEventListener('keydown',(e)=>{
    if(!state||state.done||state.locked)return;
    const k=e.key.toLowerCase();
    if((e.ctrlKey||e.metaKey)&&['c','v','x','a','p','s','u','r','t','n','w','f'].includes(k) || k==='f12' || k==='f5' || (e.altKey&&k==='tab')){e.preventDefault();lockFor('atajo de teclado restringido');}
  },true);
  document.addEventListener('contextmenu',e=>{if(state&&!state.done&&!state.locked){e.preventDefault();lockFor('menú contextual restringido');}});
  document.addEventListener('copy',e=>{if(state&&!state.done&&!state.locked){e.preventDefault();lockFor('intento de copiar contenido');}});
  document.addEventListener('paste',e=>{if(state&&!state.done&&!state.locked){e.preventDefault();lockFor('intento de pegar contenido');}});
  document.addEventListener('cut',e=>{if(state&&!state.done&&!state.locked){e.preventDefault();lockFor('intento de cortar contenido');}});
  document.addEventListener('selectstart',e=>{if(state&&!state.done&&!state.locked&&e.target.tagName!=='INPUT'){e.preventDefault();}});
  document.addEventListener('dragstart',e=>e.preventDefault());
  document.addEventListener('beforeprint',()=>lockFor('intento de impresión de la prueba'));
  try{channel=new BroadcastChannel('cesmag_english_ii_future_30q');channel.onmessage=e=>{if(!e.data||e.data.instanceId===instanceId)return;if(e.data.type==='hello'||e.data.type==='here'){if(state&&!state.done){lockFor('evaluación abierta en otra pestaña');channel.postMessage({type:'here',instanceId});}}};channel.postMessage({type:'hello',instanceId});}catch(e){}
  window.addEventListener('storage',e=>{if(e.key===KEY&&state&&!state.done){const other=retrieve();if(other&&other.startedAt===state.startedAt&&other.locked&&!state.locked){state=other;renderLocked();}}});
  try{window.speechSynthesis?.addEventListener?.('voiceschanged',()=>{});}catch(e){}
  state=retrieve();render();
})();
</script>
